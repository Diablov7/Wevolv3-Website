# Site estático - Gera sitemap durante o build
[build]
  publish = "."
  command = "node generate-sitemap.js || echo 'Sitemap generation skipped (Node.js not available)'"
  functions = "netlify/functions"

# Headers para arquivos
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

# Headers específicos para páginas normais (bloquear iframe)
[[headers]]
  for = "/*.html"
  [headers.values]
    X-Frame-Options = "DENY"

# Headers para Sanity Studio - permitir embedding no Dashboard
# Removemos X-Frame-Options e usamos apenas Content-Security-Policy
# conforme documentação: https://www.sanity.io/docs/dashboard/dashboard-configure
[[headers]]
  for = "/studio/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://*.sanity.io https://www.sanity.io;"

# Sanity Studio JS - Force content type
[[headers]]
  for = "/studio/static/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css"

# Clean blog URLs: /blog/<slug> serve o shell do artigo (rewrite, mantem a URL limpa na barra)
[[redirects]]
  from = "/blog/*"
  to = "/singleblog.html"
  status = 200

# 301 das URLs antigas com parametro -> URL limpa (preserva SEO / autoridade)
[[redirects]]
  from = "/singleblog.html"
  query = {slug = ":slug"}
  to = "/blog/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/singleblog"
  query = {slug = ":slug"}
  to = "/blog/:slug"
  status = 301
  force = true

# Fallback: /singleblog sem slug -> listagem do blog
[[redirects]]
  from = "/singleblog"
  to = "/singleblog.html"
  status = 200

# Sanity Studio - Servir localmente como SPA
# Arquivos estáticos têm prioridade (force = true)
[[redirects]]
  from = "/studio/static/*"
  to = "/studio/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/studio/*"
  to = "/studio/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/studio"
  to = "/studio/index.html"
  status = 200
  force = true

# Edge Function para injetar meta tags Open Graph dinamicamente
[[edge_functions]]
  function = "inject-og-tags"
  path = "/blog/*"

[[edge_functions]]
  function = "inject-og-tags"
  path = "/singleblog"

[[edge_functions]]
  function = "inject-og-tags"
  path = "/singleblog.html"
