# Site estático - Gera páginas de news + sitemap durante o build
[build]
  publish = "."
  command = "(node generate-news.js && node generate-sitemap.js) || echo 'Static generation skipped (Node.js not available)'; node inject-analytics.js && node strip-internal.js"
  functions = "netlify/functions"

# Varredura de segredos: LIGADA (SECRETS_SCAN_ENABLED=true no painel). Ela ficou
# desligada ate 23/08/2026, e foi por isso que um token do Telegram hardcoded passou
# 52 dias em producao sem nenhum alarme.
#
# As duas chaves abaixo sao os unicos falsos positivos, e sao publicas por definicao:
# o prefixo VITE_ significa que o valor vai para o bundle do cliente, e todo navegador
# que abre o blog precisa das duas para consultar o CDN do Sanity. Aparecem em
# blog.html, index.html, singleblog.html, singlework.html, works.html e no bundle do
# Studio. Nao sao credencial: nao dao escrita, e o dataset e publico.
#
# Silenciar SO estas duas e o ponto. Nao voltar a desligar a varredura inteira, senao
# credencial de verdade (TELEGRAM_BOT_TOKEN, RESEND_API_KEY, OPENROUTER_API_KEY,
# TWITTERAPI_IO_KEY, SANITY_PREVIEW_SECRET) volta a passar batido.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_SANITY_PROJECT_ID,VITE_SANITY_DATASET"


# Remove o codigo-fonte das funcoes do output publicado. Precisa ser um plugin
# porque o empacotamento das funcoes acontece depois do comando de build.
[[plugins]]
  package = "/plugins/strip-functions"

# Headers de seguranca aplicados a TODAS as rotas, incluindo as dinamicas
# servidas pelas edge functions (/blog/<slug>, /works/<slug>) que antes nao
# herdavam nada disso porque o bloco anterior so cobria "/*.html".
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://cdn.sanity.io https://res.cloudinary.com https://www.google-analytics.com https://wevolv3.com; connect-src 'self' https://*.api.sanity.io https://*.apicdn.sanity.io https://*.google-analytics.com https://*.analytics.google.com https://us.i.posthog.com https://us-assets.i.posthog.com; media-src 'self' https://res.cloudinary.com https://uploads.postiz.com; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; base-uri 'self'; object-src 'none'; frame-ancestors 'self'"

# Sanity Studio precisa embutir em iframe do proprio Sanity Dashboard e roda
# muito JS de terceiros (Studio bundle) — CSP dedicada e mais permissiva so
# nessa rota, sem X-Frame-Options DENY que quebraria o embed.
[[headers]]
  for = "/studio/*"
  [headers.values]
    X-Frame-Options = ""
    Content-Security-Policy = "frame-ancestors 'self' https://*.sanity.io https://www.sanity.io;"

# Sanity Studio JS - Force content type
[[headers]]
  for = "/studio/static/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css"

# Clean blog URLs: /blog/<slug> serve o shell do artigo (fallback caso a edge function nao rode).
# O 301 das URLs antigas (?slug=) e feito pela edge function inject-og-tags (mais confiavel
# que redirect por query, que a edge intercepta antes).

# ---------------------------------------------------------------------------
# Bloqueio de material interno
#
# publish = "." serve a raiz inteira do repositorio, entao documentos de
# estrategia, scripts de commit, codigo-fonte das funcoes e o projeto do Sanity
# ficavam baixaveis por qualquer um (e indexaveis: o robots.txt nao tem
# Disallow). Nada disso e conteudo do site.
#
# force = true faz a regra vencer o arquivo estatico existente. netlify/functions
# NAO pode ser removida do repo porque o Netlify a usa para compilar as funcoes,
# por isso o bloqueio dela e por rota.
#
# Ao adicionar um novo arquivo interno na raiz, acrescente a regra aqui.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wevolv3/*"
  to = "/404.html"
  status = 404
  force = true

