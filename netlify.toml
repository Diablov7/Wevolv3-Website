# Propostas de cliente: /p/<slug de 22 chars>, servido pela funcao proposal-view.
# Link permanente, publico para quem tem, fora de todo indice. Das tres camadas de
# noindex (robots.txt, meta tag, header), o X-Robots-Tag e a unica que vale quando o
# link e aberto por um crawler que nunca leu o robots.txt do site.
[[redirects]]
  from = "/p/*"
  to = "/.netlify/functions/proposal-view?slug=:splat"
  status = 200

[[headers]]
  for = "/p/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Referrer-Policy = "no-referrer"

[[redirects]]
  from = "/blog/*"
  to = "/singleblog.html"
  status = 200

# /singleblog sem slug -> shell do artigo
[[redirects]]
  from = "/singleblog"
  to = "/singleblog.html"
  status = 200

# Clean work URLs: /works/<slug> serve o shell da case (fallback; a edge function
# clean-work-urls serve e faz o 301 das URLs antigas ?slug=)
[[redirects]]
  from = "/works/*"
  to = "/singlework.html"
  status = 200

# /singlework sem slug -> shell da case
[[redirects]]
  from = "/singlework"
  to = "/singlework.html"
  status = 200

# Sanity Studio - Servir localmente como SPA
# Arquivos estáticos têm prioridade (force = true)
[[redirects]]
  from = "/studio/static/*"
  to = "/studio/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/studio/*"
  to = "/studio/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/studio"
  to = "/studio/index.html"
  status = 200
  force = true

# Edge Function: URLs limpas para as cases (/works/<slug>)
[[edge_functions]]
  function = "clean-work-urls"
  path = "/works/*"

[[edge_functions]]
  function = "clean-work-urls"
  path = "/singlework"

[[edge_functions]]
  function = "clean-work-urls"
  path = "/singlework.html"

# Edge Function para injetar meta tags Open Graph dinamicamente
[[edge_functions]]
  function = "inject-og-tags"
  path = "/blog/*"

[[edge_functions]]
  function = "inject-og-tags"
  path = "/singleblog"

[[edge_functions]]
  function = "inject-og-tags"
  path = "/singleblog.html"
