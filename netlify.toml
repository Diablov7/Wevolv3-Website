# Site estático - Gera páginas de news + sitemap durante o build
[build]
  publish = "."
  command = "node generate-news.js && node generate-sitemap.js || echo 'Static generation skipped (Node.js not available)'"
  functions = "netlify/functions"

# Headers para arquivos
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

# Headers específicos para páginas normais (bloquear iframe)
[[headers]]
  for = "/*.html"
  [headers.values]
    X-Frame-Options = "DENY"

# Headers para Sanity Studio - permitir embedding no Dashboard
# Removemos X-Frame-Options e usamos apenas Content-Security-Policy
# conforme documentação: https://www.sanity.io/docs/dashboard/dashboard-configure
[[headers]]
  for = "/studio/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://*.sanity.io https://www.sanity.io;"

# Sanity Studio JS - Force content type
[[headers]]
  for = "/studio/static/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css"

# Clean blog URLs: /blog/<slug> serve o shell do artigo (fallback caso a edge function nao rode).
# O 301 das URLs antigas (?slug=) e feito pela edge function inject-og-tags (mais confiavel
# que redirect por query, que a edge intercepta antes).
[[redirects]]
  from = "/blog/*"
  to = "/singleblog.html"
  status = 200

# /singleblog sem slug -> shell do artigo
[[redirects]]
  from = "/singleblog"
  to = "/singleblog.html"
  status = 200

# Clean work URLs: /works/<slug> serve o shell da case (fallback; a edge function
# clean-work-urls serve e faz o 301 das URLs antigas ?slug=)
[[redirects]]
  from = "/works/*"
  to = "/singlework.html"
  status = 200

# /singlework sem slug -> shell da case
[[redirects]]
  from = "/singlework"
  to = "/singlework.html"
  status = 200

# Sanity Studio - Servir localmente como SPA
# Arquivos estáticos têm prioridade (force = true)
[[redirects]]
  from = "/studio/static/*"
  to = "/studio/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/studio/*"
  to = "/studio/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/studio"
  to = "/studio/index.html"
  status = 200
  force = true

# Edge Function: URLs limpas para as cases (/works/<slug>)
[[edge_functions]]
  function = "clean-work-urls"
  path = "/works/*"

[[edge_functions]]
  function = "clean-work-urls"
  path = "/singlework"

[[edge_functions]]
  function = "clean-work-urls"
  path = "/singlework.html"

# Edge Function para injetar meta tags Open Graph dinamicamente
[[edge_functions]]
  function = "inject-og-tags"
  path = "/blog/*"

[[edge_functions]]
  function = "inject-og-tags"
  path = "/singleblog"

[[edge_functions]]
  function = "inject-og-tags"
  path = "/singleblog.html"
