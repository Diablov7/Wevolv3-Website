# Site estático - Gera páginas de news + sitemap durante o build
[build]
  publish = "."
  command = "node generate-news.js && node generate-sitemap.js || echo 'Static generation skipped (Node.js not available)'"
  functions = "netlify/functions"

# Headers de seguranca aplicados a TODAS as rotas, incluindo as dinamicas
# servidas pelas edge functions (/blog/<slug>, /works/<slug>) que antes nao
# herdavam nada disso porque o bloco anterior so cobria "/*.html".
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://cdn.sanity.io https://res.cloudinary.com https://www.google-analytics.com https://wevolv3.com; connect-src 'self' https://*.api.sanity.io https://*.apicdn.sanity.io https://*.google-analytics.com https://*.analytics.google.com; media-src 'self' https://res.cloudinary.com https://uploads.postiz.com; frame-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'"

# Sanity Studio precisa embutir em iframe do proprio Sanity Dashboard e roda
# muito JS de terceiros (Studio bundle) — CSP dedicada e mais permissiva so
# nessa rota, sem X-Frame-Options DENY que quebraria o embed.
[[headers]]
  for = "/studio/*"
  [headers.values]
    X-Frame-Options = ""
    Content-Security-Policy = "frame-ancestors 'self' https://*.sanity.io https://www.sanity.io;"

# Sanity Studio JS - Force content type
[[headers]]
  for = "/studio/static/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css"

# Clean blog URLs: /blog/<slug> serve o shell do artigo (fallback caso a edge function nao rode).
# O 301 das URLs antigas (?slug=) e feito pela edge function inject-og-tags (mais confiavel
# que redirect por query, que a edge intercepta antes).
[[redirects]]
  from = "/blog/*"
  to = "/singleblog.html"
  status = 200

# /singleblog sem slug -> shell do artigo
[[redirects]]
  from = "/singleblog"
  to = "/singleblog.html"
  status = 200

# Clean work URLs: /works/<slug> serve o shell da case (fallback; a edge function
# clean-work-urls serve e faz o 301 das URLs antigas ?slug=)
[[redirects]]
  from = "/works/*"
  to = "/singlework.html"
  status = 200

# /singlework sem slug -> shell da case
[[redirects]]
  from = "/singlework"
  to = "/singlework.html"
  status = 200

# Sanity Studio - Servir localmente como SPA
# Arquivos estáticos têm prioridade (force = true)
[[redirects]]
  from = "/studio/static/*"
  to = "/studio/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/studio/*"
  to = "/studio/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/studio"
  to = "/studio/index.html"
  status = 200
  force = true

# Edge Function: URLs limpas para as cases (/works/<slug>)
[[edge_functions]]
  function = "clean-work-urls"
  path = "/works/*"

[[edge_functions]]
  function = "clean-work-urls"
  path = "/singlework"

[[edge_functions]]
  function = "clean-work-urls"
  path = "/singlework.html"

# Edge Function para injetar meta tags Open Graph dinamicamente
[[edge_functions]]
  function = "inject-og-tags"
  path = "/blog/*"

[[edge_functions]]
  function = "inject-og-tags"
  path = "/singleblog"

[[edge_functions]]
  function = "inject-og-tags"
  path = "/singleblog.html"
